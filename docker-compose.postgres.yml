# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
services:
  api:
    environment:
      DATABASE_URL: postgresql://openterminal:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a URI-safe password}@postgres:5432/openterminal
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: openterminal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: openterminal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openterminal -d openterminal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
