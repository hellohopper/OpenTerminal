name: iOS
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', 'server/**', 'web/**', 'scripts/ios-integration.mjs', 'scripts/mac-service-lib.mjs', 'tests/fixtures/providers.mjs', 'package*.json', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'server/**', 'web/**', 'scripts/ios-integration.mjs', 'scripts/mac-service-lib.mjs', 'tests/fixtures/providers.mjs', 'package*.json', '.github/workflows/ios.yml']
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native client against the real web proxy and SQLite backend
        run: npm run test:ios:integration
      - name: Integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-backend-integration
          path: |
            test-results/ios-integration/run-*/logs/*.log
            test-results/ios-integration/run-*/result.json
          if-no-files-found: ignore
      - name: Core API, valuation and app state tests
        run: swift test --disable-xctest --package-path ios
      - name: Build native iPhone and iPad app
        run: xcodebuild -project ios/OpenTerminal.xcodeproj -scheme OpenTerminal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/OpenTerminalDerived CODE_SIGNING_ALLOWED=NO build
